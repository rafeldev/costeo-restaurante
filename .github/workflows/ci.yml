name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: costeo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/costeo_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/costeo_test?schema=public
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      AUTH_TRUST_HOST: "true"
      SEED_OWNER_EMAIL: pilot@example.com
      SEED_OWNER_PASSWORD: pilot-password-123
      SEED_RESTAURANT_NAME: Restaurante Piloto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Verificar replay idempotente de migraciones
        run: npx prisma migrate deploy
      - run: npm run audit:prod
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
